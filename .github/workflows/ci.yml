name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 0. 前端第三方资产（htmx 经 go:embed 参与 go build；
      #    版本+SHA256 锁定，仓库不提交现成库，见 web/setup.sh）
      - name: fetch web assets
        run: web/setup.sh

      # 1. 生成物与提交一致（templ + resgen generate 后无 diff）
      - name: generate (drift check)
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate
          go generate ./...
          git diff --exit-code

      # 2. 依赖方向：按 .go-arch-lint.yml 检查
      - name: go-arch-lint
        run: go run github.com/fe3dback/go-arch-lint@v1.19.0 check --project-path .

      # 3. workflow 确定性：禁 time.Now / IO 等非确定性调用
      - name: workflowcheck
        run: go run go.temporal.io/sdk/contrib/tools/workflowcheck@v0.5.0 ./internal/...

      # 4. go vet + 构建 + 测试（测试不需要 Temporal Server）
      - name: vet / build / test
        run: |
          go vet ./...
          go build ./...
          go test ./... -count=1
